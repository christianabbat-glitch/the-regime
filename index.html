<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#2a1d17;color:#f3e9d2;font-family:'PT Sans',sans-serif;overflow:hidden}
body.tall{overflow-y:auto;overflow-x:hidden}
body.tall #top{flex-direction:column}
button{font-family:inherit;cursor:pointer}
#app{display:flex;height:100vh}
body.tall #app{flex-direction:column;height:auto}
#bw{position:relative;flex:0 0 auto;overflow:hidden;background:#1d140f}
#board{position:absolute;left:0;top:0;width:1000px;height:1000px;transform-origin:0 0;background:#efe6d0;color:#2a1d17;overflow:hidden}
.ab{position:absolute}
.lbl{position:absolute;font-family:Oswald,sans-serif;letter-spacing:.06em;white-space:nowrap;transform-origin:0 50%;line-height:18px}
.box{position:absolute;border-radius:8px}
.bt{font-family:Oswald,sans-serif;letter-spacing:.07em;font-size:15px}
.bs{font-size:11px;opacity:.85}
.slotb{position:absolute;width:58px;height:24px;border-radius:5px;border:1.5px dashed}
.tok{position:absolute;width:62px;height:24px;border-radius:5px;font-family:'PT Sans Narrow','PT Sans',sans-serif;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;transition:left .8s ease,top .8s ease,background .4s,opacity .4s;box-shadow:0 1px 2px rgba(0,0,0,.4);white-space:nowrap;z-index:5}
.tok span{max-width:60px;overflow:hidden;text-overflow:clip}
.tok.l1{font-size:11px}.tok.l2{font-size:10px;letter-spacing:-.2px}
.tok.sP{background:#e3b521;color:#3a2d00}.tok.sN{background:#2f62b0;color:#fff}.tok.sI{background:#2f7d4a;color:#fff}.tok.sR{background:#b3261e;color:#fff}.tok.sJ{background:#222;color:#fff}
.tok.trh,.tok.tkal{background:#f8f1e1;color:#5a1311;border:2px solid #d4af37}
.tok.tlub{background:#5d5d66;color:#f0f0f0}.tok.tshar{background:#f2f8ee;color:#1e5632;border:1px solid #2c6e43}
.tok.tgulag{background:#c3bdb1;color:#2c2a26}.tok.tcanal{background:#dbe8f0;color:#1d3a4d;border:1px solid #7f9fb3}

.tok .ob.nob{background:#8a8a8a}
.tok .md{position:absolute;right:-6px;top:-6px;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff3b0,#d4a017 60%,#8a6a00);border:1px solid #5a4500}
.tok.pick{outline:3px solid #ff2fd0;outline-offset:2px;cursor:pointer;z-index:9;animation:pk 1s infinite}
.tok.hl{outline:3px solid #e8412f;outline-offset:2px;z-index:8}
.tok.subj{outline:2px dashed #e8412f;outline-offset:3px;z-index:8}
@keyframes pk{50%{outline-color:#ffd84a}}
.pile{position:absolute;width:32px;height:46px;border-radius:4px;border:2px solid rgba(0,0,0,.35);box-shadow:0 2px 0 rgba(0,0,0,.25),0 4px 0 rgba(0,0,0,.15)}
.pile.pick{outline:3px solid #ff2fd0;outline-offset:2px;cursor:pointer;animation:pk 1s infinite}
.pile.empty{opacity:.25;box-shadow:none}
.pcount{position:absolute;width:32px;text-align:center;font-size:11px;color:#4a3d27}
#panel{flex:1;min-width:0;display:flex;flex-direction:column;padding:8px 12px 0;gap:8px;min-height:0;overflow:auto}
#top{display:flex;align-items:flex-start;gap:10px}
#cap{flex:1;font-size:15px;line-height:1.3;min-height:42px}
#cap .pr{display:block;color:#ffd84a;font-weight:700}
#ctl{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

#ctl button:hover,.btn:hover{background:#5d4030}
#pl{display:flex;flex-wrap:wrap;gap:6px}
.pchip{background:#3a2a22;border-radius:8px;padding:5px 8px;min-width:118px;border:2px solid #3a2a22;font-size:12px}
.pchip.lead{border-color:#ffd84a}
.pchip.pick{border-color:#ff2fd0;cursor:pointer}
.pchip .nm{font-weight:700;font-size:13px;display:flex;align-items:center;gap:5px}
.pchip .dot{width:11px;height:11px;border-radius:50%;border:2px solid #fff}
.backs{display:flex;gap:5px;margin-top:4px;min-height:14px}
.bg{display:flex}
.bk{width:8px;height:13px;border-radius:2px;border:1px solid rgba(0,0,0,.45);margin-right:-3px}
.rvl{font-size:11px;color:#d8c9ad;margin-top:3px}
#tbl{background:radial-gradient(ellipse at 50% 40%,#4d3426,#36241b);border-radius:10px;padding:8px 10px;min-height:220px;position:relative;border:1px solid #5a4030}
#tbl .th{display:flex;align-items:center;gap:8px;font-family:Oswald,sans-serif;letter-spacing:.06em;font-size:15px;margin-bottom:6px;min-height:22px}
#tbl .th i{width:14px;height:14px;border-radius:3px;display:inline-block}
#trow{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.tslot{display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .6s ease}
.tslot .who{font-size:11px;color:#d8c9ad;max-width:96px;text-align:center}
#tug{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;min-height:20px}
#tug .side{display:flex;gap:3px;align-items:center}
#tug .v{width:10px;height:14px;border-radius:2px}
#res{margin-top:4px;font-size:14px;font-weight:700;color:#ffd84a;min-height:18px}
#mine{display:flex;gap:6px;flex-wrap:wrap}
.mc{width:82px;min-height:46px;background:#f3e9d2;color:#2a1d17;border-radius:6px;padding:3px 6px;font-size:10px;border-left:6px solid #999;position:relative;line-height:1.2}
.mc b{font-size:12px;display:block}
.mc .rb{display:block;font-size:9px;font-weight:700;color:#7d1d1a;margin-top:1px}
.mc.pick{outline:3px solid #ff2fd0;cursor:pointer}
.mc.dead{opacity:.45}
.mc.blank{border-left-color:#555;background:#d8cdb6;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
#hand{position:relative;flex:1 0 192px;margin:0 -12px;overflow:hidden}
.hcw{position:absolute;bottom:24px;transition:transform .25s ease,left .25s ease;transform-origin:50% 120%}
.hcw.dim .card{filter:brightness(.55)}
.hcw.can{cursor:pointer}
.hcw.can .card{box-shadow:0 0 0 3px #ff2fd0}
.card{width:92px;height:132px;position:relative;transform-style:preserve-3d;transition:transform .5s ease}
.card.fd{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;border-radius:8px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.card .f{background:linear-gradient(to bottom right,#f8f1df 0 57%,#e6d3a8 57% 100%);color:#2a1d17;border:2px solid #1a120d;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.card .b{transform:rotateY(180deg);border:2px solid #1a120d;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.card .h{height:15px;font-family:Oswald,sans-serif;font-size:8.5px;letter-spacing:.1em;display:flex;align-items:center;padding-left:6px}
.card .a{position:absolute;top:18px;left:5px;right:12px}
.card .a b{font-size:9.5px;line-height:1.15;display:block}
.card .a .ad,.card .a .as,.card .r .rf{display:none}
.card .r{position:absolute;right:6px;bottom:6px;left:6px;text-align:right}
.card .r b{font-family:Oswald,sans-serif;font-size:13px;letter-spacing:.05em}
.card .fate{position:absolute;left:5px;bottom:5px;font-size:7.5px;font-weight:700;color:#7d1d1a;text-transform:uppercase}
.card.ag .r{opacity:.3}.card.rs .a{opacity:.3}
.card.mid{width:150px;height:212px}
.card.mid .h{height:20px;font-size:11px}
.card.mid .a{top:24px;left:8px;right:16px}
.card.mid .a b{font-size:12.5px}
.card.mid .a .ad{display:block;font-size:10.5px;margin-top:4px;line-height:1.25}
.card.mid .a .as{display:block;font-size:10px;margin-top:3px;font-style:italic;color:#5a4a30}
.card.mid .r b{font-size:16px}
.card.mid .fate{font-size:9px}
.card.big{width:220px;height:312px}
.card.big .h{height:24px;font-size:13px}
.card.big .a{top:30px;left:10px;right:22px}
.card.big .a b{font-size:15px}
.card.big .a .ad{display:block;font-size:12.5px;margin-top:6px;line-height:1.3}
.card.big .a .as{display:block;font-size:12px;margin-top:5px;font-style:italic;color:#5a4a30}
.card.big .r{right:10px;bottom:10px}
.card.big .r b{font-size:20px}
.card.big .r .rf{display:block;font-size:11.5px;font-style:italic;line-height:1.25}
.card.big .fate{font-size:10px;bottom:10px;left:10px}
.card.chr .f{background:#f3e9d2}
.card.chr .cn{position:absolute;top:22px;left:7px;right:7px;font-weight:700;font-size:11px;line-height:1.15}
.card.chr .ct{position:absolute;top:56px;left:7px;right:7px;font-size:9px;line-height:1.2;color:#5a4a30}
#pv{position:fixed;z-index:40;display:none;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
#pv.on{display:flex}
#pv button{pointer-events:auto;background:#ffd84a;color:#2a1d17;border:none;border-radius:8px;padding:8px 14px;font-weight:700;font-size:14px}
#ov{position:fixed;inset:0;background:rgba(20,12,8,.86);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
#ov.on{display:flex}
.ovb{background:#3a2a22;border:1px solid #7a5a45;border-radius:12px;padding:22px 26px;max-width:640px;width:100%;max-height:92vh;overflow:auto;line-height:1.45}
.ovb h1{font-family:Oswald,sans-serif;letter-spacing:.05em;margin:0 0 6px;font-size:30px}
.ovb h2{font-family:Oswald,sans-serif;letter-spacing:.05em;font-size:18px;margin:16px 0 4px}
.ovb p{margin:6px 0}
.np{display:flex;gap:8px;margin:12px 0}
.np button{font-size:18px;padding:10px 18px;background:#4a3226;color:#f3e9d2;border:2px solid #7a5a45;border-radius:8px}
.np button.on{border-color:#ffd84a}
.go{background:#ffd84a!important;color:#2a1d17!important;border:none!important;font-weight:700;font-size:16px!important;padding:10px 20px!important;border-radius:8px}
table.fin{border-collapse:collapse;width:100%;font-size:13px}
table.fin td,table.fin th{border-bottom:1px solid #5a4030;padding:5px 6px;text-align:left;vertical-align:top}
.fly{position:fixed;z-index:30;pointer-events:none;transition:left .55s ease,top .55s ease,transform .55s ease}
</style>
</head>

 </div>

const $=s=>document.querySelector(s);
let RNG=Math.random;
function rnd(n){return Math.floor(RNG()*n)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function seeded(seed){let s=seed>>>0;return()=>{s=(s+0x6D2B79F5)|0;let t=Math.imul(s^(s>>>15),1|s);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
let SPEED=1,PAUSED=false,GEN=0;
const CANCEL={};
async function wait(ms){const g=GEN;if(window.__fast){await new Promise(r=>setTimeout(r,0));if(g!==GEN)throw CANCEL;return}
 let t=0;const step=50;while(t<ms*SPEED||PAUSED){await new Promise(r=>setTimeout(r,step));if(g!==GEN)throw CANCEL;if(!PAUSED)t+=step}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

// ================= DECKS =================
let CARDS={};
function buildDecks(){
 const r=seeded(1937);const keep=RNG;RNG=r;
 const decks={};CARDS={};let n=0;
 for(const d of D){
  const ags=[];AG[d].forEach((a,i)=>{for(let c=0;c<a.c;c++)ags.push(i)});
  const rs=[];for(const k in RESPMIX[d])for(let c=0;c<RESPMIX[d][k];c++)rs.push(k);
  while(rs.length<ags.length)rs.push('Abstain');
  shuffle(rs);
  const fates=[];for(const k in FATES)for(let c=0;c<FATES[k];c++)fates.push(k);shuffle(fates);
  decks[d]=ags.map((ai,j)=>{const id='c'+(n++);const c={id,d,ag:AG[d][ai],resp:rs[j]};if(d==='J')c.fate=fates[j%fates.length];CARDS[id]=c;return id});
 }
 RNG=keep;return decks;
}

// ================= STATE =================
let S=null;const HUMAN=0;
function newState(np){
 const decks=buildDecks();
 S={np,round:0,players:[],men:{},seats:{P:[],N:[],I:[],R:[],J:[]},rh:null,kal:null,lub:[],shar:[],gulag:[],canal:Array(8).fill(null),exile:[],grave:[],
  decks:{},disc:{P:[],N:[],I:[],R:[],J:[]},line:LINE0,deferred:{},over:false,M:null,stats:{arrests:0,deaths:0,skipped:0,meetings:0,burn:0},firstDraw:0,nkvdMet:false};
 for(const d of D)S.decks[d]=shuffle(decks[d].slice());
 S.decks.N=S.decks.N.slice(0,8*np);
 MEN.forEach((m,i)=>{const id='m'+i;S.men[id]={id,home:m[0],sn:m[1],name:m[2],title:m[3],owner:null,rev:false,nobody:false,medal:false,from:null};
  if(D.includes(m[0]))S.seats[m[0]].push(id);else if(m[0]==='RH')S.rh=id;else if(m[0]==='K')S.kal=id;else S.exile.push(id)});
 for(let p=0;p<np;p++)S.players.push({i:p,name:PNAMES[p],ai:p!==HUMAN,hand:[]});
 const ids=shuffle(Object.keys(S.men));
 for(let p=0;p<np;p++)for(let k=0;k<6;k++){S.men[ids[p*6+k]].owner=p}
 for(const p of S.players)for(const d of D)for(let k=0;k<2;k++)p.hand.push(S.decks[d].pop());
}
const P=i=>S.players[i];
const man=id=>S.men[id];
const hand=p=>P(p).hand.map(c=>CARDS[c]);
function where(id){
 for(const d of D){const r=S.seats[d].indexOf(id);if(r>=0)return{t:'seat',d,r}}
 if(S.rh===id)return{t:'rh'};if(S.kal===id)return{t:'kal'};
 for(const t of ['lub','shar','gulag','exile','grave']){const i=S[t].indexOf(id);if(i>=0)return{t,i}}
 const ci=S.canal.indexOf(id);if(ci>=0)return{t:'canal',i:ci};
 return{t:'none'};
}
const alive=id=>where(id).t!=='grave';
const isFree=id=>['seat','rh','kal','exile'].includes(where(id).t);
function owned(p){return Object.values(S.men).filter(m=>m.owner===p).map(m=>m.id)}
function lineDept(){const l=S.line.ag.line;return l&&l!=='-'?l:null}
function locName(id){const w=where(id);
 if(w.t==='seat')return `${DN[w.d]}, ${RANKN[w.r]} seat`;
 return{rh:"Stalin's right hand",kal:'Head of State',lub:'the Lubyanka',shar:'the sharashka',gulag:'the Gulag',canal:'the White Sea Canal',exile:'exile',grave:'dead'}[w.t]||'';}

// ================= MOVES =================
function pull(id){
 const w=where(id);
 if(w.t==='seat'){S.seats[w.d].splice(w.r,1);man(id).from=w.d}
 else if(w.t==='rh'){S.rh=null;man(id).from='RH'}
 else if(w.t==='kal'){S.kal=null;man(id).from='K'}
 else if(w.t==='canal')S.canal[w.i]=null;
 else if(w.t!=='none')S[w.t].splice(w.i,1);
 return w;
}
function kill(id){pull(id);S.grave.push(id);S.stats.deaths++}
function arrest(id){const m=man(id);if(m.medal){m.medal=false;return'medal'}pull(id);S.lub.push(id);S.stats.arrests++;return'ok'}
function enter(d,id){if(S.seats[d].length>=7)return false;pull(id);S.seats[d].push(id);return true}
function toGulag(id){pull(id);S.gulag.push(id)}
function canalPush(n){for(let k=0;k<n;k++){const last=S.canal[7];if(last){S.canal[7]=null;S.grave.push(last);S.stats.deaths++}for(let i=7;i>0;i--)S.canal[i]=S.canal[i-1];S.canal[0]=null}}
function toCanal(id){pull(id);let i=S.canal.indexOf(null);if(i<0){canalPush(1);i=0}S.canal[i]=id}
function toShar(id){if(S.shar.length>=3)return false;pull(id);S.shar.push(id);return true}
function toExile(id){if(S.exile.length>=3)return false;pull(id);S.exile.push(id);return true}
function moveSeat(id,delta){const w=where(id);if(w.t!=='seat')return;const a=S.seats[w.d];a.splice(w.r,1);const nr=Math.max(0,Math.min(a.length,w.r+delta));a.splice(nr,0,id)}
function swapIR(id){const w=where(id);if(w.t!=='seat'||w.d!=='R')return false;const o=S.seats.I[w.r];if(!o)return false;S.seats.R[w.r]=o;S.seats.I[w.r]=id;return true}
function favourite(id){const w=where(id);if(w.t!=='seat'||w.r!==0)return false;const old=S.rh;if(old){S.seats[w.d][0]=old}else S.seats[w.d].splice(0,1);S.rh=id;return true}
function sentence(id,r){if(r<=0){if(!toShar(id))toGulag(id)}else if(r===1)toGulag(id);else if(r===2)toCanal(id);else kill(id)}
function fateFlip(){
 if(!S.decks.J.length&&S.disc.J.length){S.decks.J=shuffle(S.disc.J);S.disc.J=[]}
 if(!S.decks.J.length)return['Shot','Gulag','Gulag','Canal','Shot','Sharashka'][rnd(6)];
 const c=S.decks.J.pop();S.disc.J.push(c);return CARDS[c].fate;
}

// ================= TARGETS =================
function areaIds(a){
 const z=a.z;if(z.none)return null;let ids=[];
 if(z.seat){const ld=z.seat==='LINE'?lineDept():z.seat;ids=(ld?[ld]:D).flatMap(d=>S.seats[d])}
 else if(z.anyBut){const ex=z.anyBut==='LINE'?lineDept():z.anyBut;if(z.anyBut==='LINE'&&!ex)return[];ids=D.filter(d=>d!==ex).flatMap(d=>S.seats[d])}
 else if(z.low)ids=D.flatMap(d=>S.seats[d].slice(4));
 else if(z.polit)ids=D.map(d=>S.seats[d][0]).filter(Boolean).concat(S.rh?[S.rh]:[]);
 else if(z.heads)ids=D.map(d=>S.seats[d][0]).filter(Boolean);
 else if(z.pris)ids=z.pris.flatMap(t=>t==='canal'?S.canal.filter(Boolean):S[t]);
 else if(z.lubLine){const ld=lineDept();ids=S.lub.filter(id=>!ld||man(id).from===ld)}
 else if(z.exile)ids=S.exile.slice();
 else if(z.fixed){const f=fixedSubj(z.fixed);ids=f?[f]:[]}
 return ids.filter(Boolean);
}
function fixedSubj(f){if(f==='headR')return S.seats.R[0]||null;if(f==='frontGulag')return S.gulag[0]||null;if(f==='bottomI'){const a=S.seats.I;return a[a.length-1]||null}return null}
function nextOf(id,dir){const w=where(id);
 if(w.t==='seat')return S.seats[w.d][w.r+dir]||null;
 if(['lub','gulag','shar','exile'].includes(w.t))return S[w.t][w.i+dir]||null;
 if(w.t==='canal'){for(let i=w.i+dir;i>=0&&i<8;i+=dir)if(S.canal[i])return S.canal[i];return null}
 return null}
function neighbours(id){return[nextOf(id,-1),nextOf(id,1)].filter(Boolean)}
function nameable(M){const ids=areaIds(M.ag)||[];return ids.filter(i=>!M.named.includes(i)&&i!==M.subj)}

// ================= AI =================
function wt(p,id){const m=man(id);if(m.owner===p)return 1;if(m.nobody)return 0;if(m.rev&&m.owner!=null)return -0.7;return -0.25}
function val(p,k,ids,amt,rung){
 let v=0;
 for(const id of ids){if(!id)continue;const w=wt(p,id),m=man(id);
  switch(k){
  case'arrest':v-=w*(m.medal?0.05:0.8);break;
  case'shoot':case'accident':v-=w;break;
  case'assassin':v-=w*0.4;break;
  case'expose':if(m.owner===p&&!m.rev)v-=0.35;else if(!m.rev&&!m.nobody)v+=0.12;break;
  case'medal':v+=w*(m.medal?0.05:0.45);break;
  case'promote':v+=w*0.12*amt;break;
  case'demote':v-=w*0.12*amt;break;
  case'bottom':v-=w*0.3;break;
  case'exileOut':v+=w*0.5;break;
  case'draft':case'sharBack':case'amnesty':v+=w*0.7;break;
  case'feed':v-=w*0.6;break;
  case'toShar':v+=w*0.5;break;
  case'canalBack':v+=w*0.45;break;
  case'transferI':v-=w*0.1;break;
  case'transferTo':v+=w*(topClaimOf(amt)?-0.05:0.25);break;
  case'favourite':v+=w*0.2;break;
  case'verdict':case'mass':v+=w*[0.3,0,-0.55,-1][Math.max(0,Math.min(3,rung))];break;
  case'review':v-=w*0.45;break;
  }}
 if(k==='push'){S.canal.forEach((id,i)=>{if(id){const w=wt(p,id);v-=w*(i>=8-amt?1:0.1)}})}
 return v;
}
function agList(M,subj){
 const a=M.ag;
 if(a.k==='mass'||a.k==='review')return S.lub.slice();
 return subj?[subj]:[];
}
function plusList(M,subj){ // what one more supporting voice would add
 const a=M.ag,l=agList(M,subj);
 if(a.x==='next'&&l.length){const n=nextOf(l[l.length-1],1);if(n)return l.concat([n])}
 if(a.x==='up'&&l.length){const n=nextOf(l[l.length-1],-1);if(n)return l.concat([n])}
 return l;
}
function agVal(p,M,subj,extra){
 const a=M.ag;extra=extra||0;
 if(a.x==='harsh')return val(p,a.k,agList(M,subj),0,(a.base||0)+extra);
 if(a.k==='transferTo')return val(p,a.k,agList(M,subj),a.to==='LINE'?lineDept():a.to,0);
 if(a.x==='more')return val(p,a.k,agList(M,subj),(a.n||0)+extra,0);
 let l=agList(M,subj);
 if(extra>0&&(a.x==='next'||a.x==='up')){for(let i=0;i<extra;i++){const n=nextOf(l[l.length-1],a.x==='up'?-1:1);if(n)l=l.concat([n])}}
 if(extra>0&&a.x==='name'){const c=nameable(M).map(id=>[id,val(p,a.k,[id],a.n||0,0)]).sort((x,y)=>y[1]-x[1]);if(c.length&&c[0][1]>0)return val(p,a.k,l,a.n||0,0)+c[0][1]}
 return val(p,a.k,l,a.n||0,0);
}
function lineVal(p,ld){if(!ld||ld==='-')return 0;let v=0;for(const id of S.seats[ld])v-=wt(p,id)*0.12;return v}
function aiLead(p,d){
 let best=null;
 for(const cid of P(p).hand){const c=CARDS[cid];if(c.d!==d)continue;const a=c.ag;const M={ag:a,named:[],subj:null};
  let opts=a.z.none?[null]:areaIds(a);
  if(!opts.length){const s={cid,subj:null,v:-0.02+RNG()*0.01};if(!best||s.v>best.v)best=s;continue}
  for(const s of opts){let v=agVal(p,M,s,0)+(a.line?lineVal(p,a.line):0)+RNG()*0.06-0.03;if(a.k==='none')v=0.01+RNG()*0.02;
   if(!best||v>best.v)best={cid,subj:s,v}}
 }
 return best;
}
function respUtil(p,M,resp){
 const a=M.ag;if(M.defer&&resp!=='Defer')return 0;
 const v0=agVal(p,M,M.subj,0),vp=agVal(p,M,M.subj,1),vp2=agVal(p,M,M.subj,2);
 if(a.x==='harsh'){const vm=agVal(p,M,M.subj,-1);
  return{Support:0.6*(vp-v0),Acclaim:0.9*(vp2-v0),Doubt:0.6*(vm-v0),Protest:0.9*(vm-v0),Defer:-0.5*v0,Abstain:0,Amend:amendGain(p,M)}[resp]}
 return{Support:0.5*v0+0.5*(vp-v0),Acclaim:0.7*v0+0.8*(vp2-v0),Doubt:-0.6*v0,Protest:-0.9*v0,Defer:-0.7*v0,Abstain:0,Amend:amendGain(p,M)}[resp];
}
function amendGain(p,M){if(!M.subj||M.ag.k==='mass'||M.ag.k==='review')return -0.01;const v0=agVal(p,M,M.subj,0);let b=-0.01;for(const n of neighbours(M.subj)){if(M.named.includes(n))continue;b=Math.max(b,agVal(p,M,n,0)-v0)}return b}
function aiRespond(p,M){
 let best=null;
 for(const cid of P(p).hand){const c=CARDS[cid];if(c.d!==M.d)continue;const u=respUtil(p,M,c.resp)+RNG()*0.04;if(!best||u>best.u)best={cid,u}}
 return best&&best.cid;
}
function aiAmend(p,M){let b=null,bv=-1e9;for(const n of neighbours(M.subj)){if(M.named.includes(n))continue;const v=agVal(p,M,n,0);if(v>bv){bv=v;b=n}}return b}
function aiName(p,M,opts){let b=null,bv=-1e9;for(const id of opts){const v=val(p,M.ag.k,[id],M.ag.n||0,0)+RNG()*0.02;if(v>bv){bv=v;b=id}}return bv>-0.05?b:null}
function aiCorridor(p){
 const cand=[];
 for(const d of D){const top=topClaim(d);const lim=top?top.r:99;
  S.seats[d].forEach((id,r)=>{const m=man(id);if(m.owner===p&&!m.rev&&r<lim){const n=P(p).hand.filter(c=>CARDS[c].d===d).length;cand.push({id,score:(7-r)*0.05+n*0.08+(top?0:0.1)})}})}
 if(!cand.length)return null;
 cand.sort((a,b)=>b.score-a.score);
 const pr=0.22+0.07*S.round+cand[0].score*0.3;
 return RNG()<pr?cand[0].id:null;
}
function aiReveal(p,opts){return opts[rnd(opts.length)]}
function aiDeck(p){
 const cnt={};D.forEach(d=>cnt[d]=0);P(p).hand.forEach(c=>cnt[CARDS[c].d]++);
 const ok=D.filter(d=>canDraw(d));if(!ok.length)return null;
 ok.sort((a,b)=>cnt[a]-cnt[b]+(RNG()-0.5)*0.9);return ok[0];
}
function aiFirst(p){const o=S.players.filter(q=>q.i!==p);return o[rnd(o.length)].i}

// ================= HUMAN INPUT =================
let PEND=null,SEL=null;
function ask(kind,o){
 return new Promise(res=>{
  PEND=Object.assign({kind,res:v=>{PEND=null;SEL=null;hidePv();render();res(v)}},o||{});
  if(window.__auto)setTimeout(()=>{if(PEND&&PEND.kind===kind)PEND.res(autoAns(kind,o||{}))},0);
  render();
 });
}
function autoAns(kind,o){
 if(kind==='lead'){const b=aiLead(HUMAN,o.d);return b?b.cid:o.cids[0]}
 if(kind==='resp')return aiRespond(HUMAN,S.M)||o.cids[0];
 if(kind==='man')return o.ai?o.ai():o.ids[0];

function tally(M){
 let f=0,a=0,mf=0,ma=0;
 for(const x of M.plays){if(x.resp==='Support'){f+=1;mf=Math.max(mf,1)}if(x.resp==='Acclaim'){f+=2;mf=Math.max(mf,2)}if(x.resp==='Doubt'){a+=1;ma=Math.max(ma,1)}if(x.resp==='Protest'){a+=2;ma=Math.max(ma,2)}}

 return{f,a,net,extra:net>0?Math.min(net,mf):0,soft:net<0?Math.min(-net,ma):0,fail:net<0};
}

// ================= RENDER =================
const TOK={};
let HL=new Set();
function flashTok(ids){HL=new Set(ids.filter(Boolean));render();setTimeout(()=>{HL=new Set();render()},1600*SPEED)}
function render(){
 if(!S)return;
 const pick=PEND&&PEND.kind==='man'?new Set(PEND.ids):new Set();
 for(const id in S.men){const m=S.men[id];let el=TOK[id];if(!el){el=document.createElement('div');el.dataset.id=id;$('#toks').appendChild(el);TOK[id]=el}
  const w=where(id),[x,y]=posOf(id);el.style.left=(x-31)+'px';el.style.top=(y-12)+'px';
  el.className='tok '+(m.sn.length>=11?'l2 ':m.sn.length>=9?'l1 ':'')+(w.t==='seat'?'s'+w.d:'t'+w.t)+(m.owner===HUMAN?' mine':'')+(pick.has(id)?' pick':'')+(HL.has(id)?' hl':S.M&&(S.M.subj===id||S.M.named.includes(id))?' subj':'');
  el.style.zIndex=w.t==='grave'?3:5;
  el.innerHTML=(m.rev&&m.owner!=null?`<i class="ob" style="background:${PCOL[m.owner]}"></i>`:m.nobody?'<i class="ob nob"></i>':'')+`<span>${esc(m.sn)}</span>`+(m.medal?'<i class="md"></i>':'');
  el.title=`${m.name}\n${m.title}\n${locName(id)}`+(m.owner===HUMAN?'\nYours'+(m.rev?' (revealed)':' (secret)'):m.rev&&m.owner!=null?`\nBelongs to ${P(m.owner).name}`:m.nobody?'\nBelongs to nobody':'')+(m.medal?'\nOrder of Lenin':'');
 }
 // piles
 document.querySelectorAll('.pile').forEach(el=>{const d=el.dataset.d;const n=S.decks[d].length;el.classList.toggle('empty',!n&&!(d!=='N'&&S.disc[d].length));el.classList.toggle('pick',!!(PEND&&PEND.kind==='deck'&&canDraw(d)))});
 document.querySelectorAll('[data-pc]').forEach(el=>{el.textContent=S.decks[el.dataset.pc].length});
 $('#discInfo').textContent=`Blue cards left: ${S.decks.N.length}`;
 $('#lineSlot').innerHTML=lineCardHTML();
 // players
 let ph='';
 for(const p of S.players){const cnt={};D.forEach(d=>cnt[d]=0);p.hand.forEach(c=>cnt[CARDS[c].d]++);
  const rv=owned(p.i).filter(id=>man(id).rev).map(id=>man(id).sn+(alive(id)?'':' †'));
  const lead=S.M&&S.M.lead===p.i;
  ph+=`<div class="pchip${lead?' lead':''}${PEND&&PEND.kind==='player'?' pick':''}" data-p="${p.i}"><div class="nm"><span class="dot" style="background:${PCOL[p.i]}"></span>${esc(p.name)}${lead?' · chair':''}</div><div class="backs">${D.map(d=>`<div class="bg">${Array.from({length:cnt[d]},()=>`<div class="bk" style="background:${DC[d]}"></div>`).join('')}</div>`).join('')}</div><div class="rvl">${rv.length?'Revealed: '+rv.join(', '):'No one revealed'}</div></div>`}
 $('#pl').innerHTML=ph;
 renderMine();renderHand();
}
function lineCardHTML(){const c=S.line;const ld=lineDept();
 return `<div style="background:#f8f1df;border:2px solid #9c7a0c;border-radius:6px;padding:6px 8px;color:#2a1d17;font-size:11.5px;line-height:1.25" class="linecard" data-cid="${c.id}"><b>${esc(c.ag.t)}</b><div style="margin-top:5px;font-weight:700;color:${ld?DL[ld]:'#555'}">Names: ${ld?DN[ld]:'nobody'}</div></div>`}
function renderMine(){
 const pend=PEND&&(PEND.kind==='corridor'||PEND.kind==='reveal');
 const ok=id=>PEND&&(PEND.kind==='reveal'?PEND.ids.includes(id):PEND.kind==='corridor'&&!man(id).rev&&alive(id));
 let h=owned(HUMAN).map(id=>{const m=man(id),w=where(id);const dc=w.t==='seat'?DC[w.d]:'#777';
  return `<div class="mc${pend&&ok(id)?' pick':''}${alive(id)?'':' dead'}" data-m="${id}" style="border-left-color:${dc}"><b>${esc(m.sn)}${m.medal?' ●':''}</b>${esc(locName(id))}${m.rev?'<span class="rb">REVEALED</span>':''}</div>`}).join('');
 if(PEND&&PEND.kind==='corridor')h+=`<div class="mc blank pick" data-m="blank">The blank: stay silent</div>`;
 $('#mine').innerHTML=`<div style="font-size:11px;color:#d8c9ad;width:100%">Your men (only you can see this):</div>`+h;
}
function cardHTML(c,cls){
 if(!c)return'';
 const a=c.ag;const hd=`<div class="h" style="background:${DC[c.d]};color:${DT[c.d]}">${DN[c.d].toUpperCase()}</div>`;
 const fate=c.fate?`<div class="fate">Fate: ${c.fate}</div>`:'';
 return `<div class="card ${cls||''}" data-cid="${c.id}"><div class="f">${hd}<div class="a"><b>${esc(a.t)}</b><span class="ad">${esc(a.d)}</span><span class="as">${esc(a.s)}</span></div><div class="r"><b>${c.resp.toUpperCase()}</b><span class="rf">${esc(FLAV[c.d][c.resp]||'')}</span></div>${fate}</div><div class="b" style="background:repeating-linear-gradient(45deg,${DC[c.d]},${DC[c.d]} 7px,${DK[c.d]} 7px,${DK[c.d]} 13px)"></div></div>`;
}
function charCard(id){return{chr:true,id}}
function charHTML(o,cls){
 const back=`<div class="b" style="background:repeating-linear-gradient(-45deg,#7d1d1a,#7d1d1a 7px,#5a1311 7px,#5a1311 13px)"></div>`;
 if(!o.id)return `<div class="card chr ${cls||''}"><div class="f" style="display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#555">BLANK<br>(silent)</div>${back}</div>`;
 const m=man(o.id),w=where(o.id);
 return `<div class="card chr ${cls||''}"><div class="f"><div class="h" style="background:${w.t==='seat'?DC[w.d]:'#777'};color:${w.t==='seat'?DT[w.d]:'#fff'}">COMES FORWARD</div><div class="cn">${esc(m.name)}</div><div class="ct">${esc(m.title)}<br><br>${esc(locName(o.id))}</div></div>${back}</div>`;
}
function renderHand(){
 const hEl=$('#hand');const me=P(HUMAN);const cs=me.hand.slice().sort((a,b)=>D.indexOf(CARDS[a].d)-D.indexOf(CARDS[b].d));
 const W=hEl.clientWidth||500,n=cs.length,cw_=92;
 const sp=n>1?Math.min(78,(W-cw_-56)/(n-1)):0;const x0=Math.max(28,(W-(cw_+sp*(n-1)))/2);
 const play=PEND&&(PEND.kind==='lead'||PEND.kind==='resp');
 let h='';
 cs.forEach((cid,i)=>{const c=CARDS[cid];const can=play&&PEND.cids.includes(cid);const rot=(i-(n-1)/2)*1.8;const lift=Math.abs(i-(n-1)/2)*1.4;
  h+=`<div class="hcw${play&&!can?' dim':''}${can?' can':''}${SEL===cid?' sel':''}" data-h="${cid}" style="left:${x0+i*sp}px;transform:translateY(${SEL===cid?-30:lift}px) rotate(${SEL===cid?0:rot}deg);z-index:${SEL===cid?50:i}">${cardHTML(c,play?(PEND.kind==='lead'?'ag':'rs'):'')}</div>`});
 hEl.innerHTML=h;
}
// ===== table =====
function clearTable(title,sub,d){
 $('#th').innerHTML=(d?`<i style="background:${DC[d]}"></i>`:'')+`<span>${esc(title)}</span><span style="font-family:'PT Sans';letter-spacing:0;font-size:12px;color:#d8c9ad">${esc(sub||'')}</span>`;
 $('#trow').innerHTML='';$('#tug').innerHTML='';$('#res').textContent='';
}
function res(t){$('#res').textContent=t;cap(t)}
function tug(){const M=S.M;if(!M)return;let f='',a='';
 for(const x of M.plays){if(x.resp==='Support')f+=v(1);if(x.resp==='Acclaim')f+=v(2);if(x.resp==='Doubt')a+=v(1,1);if(x.resp==='Protest')a+=v(2,1)}
 function v(n,ag){return `<span class="v" style="background:${ag?'#c0392b':'#27ae60'};${n>1?'width:22px':''}"></span>`}
 const T=tally(M);
 $('#tug').innerHTML=`<span>For</span><span class="side">${f||'–'}</span><span style="margin:0 6px">vs</span><span class="side">${a||'–'}</span><span>Against</span>`+(M.defer?'<span style="margin-left:10px;color:#ffd84a">DEFERRED</span>':'')+(T.fail&&M.ag.x!=='harsh'?'<span style="margin-left:10px;color:#e74c3c">failing</span>':'');
}
async function placeCard(c,p,who,mode,facedown,isAg){
 const slot=document.createElement('div');slot.className='tslot';
 const inner=c.chr?charHTML(c,'fd'):cardHTML(c,(isAg?'mid ':'')+mode+(facedown?' fd':''));
 slot.innerHTML=inner+`<div class="who">${esc(who||'')}</div>`;
 $('#trow').appendChild(slot);
 if(c.chr&&!facedown)slot.querySelector('.card').classList.remove('fd');
 // fly from player chip / hand
 let src=null;if(p===HUMAN)src=$('#hand');else if(p!=null)src=document.querySelector(`.pchip[data-p="${p}"]`);
 if(src&&!window.__fast){const a=src.getBoundingClientRect(),b=slot.getBoundingClientRect();
  slot.style.transition='none';slot.style.transform=`translate(${a.left+a.width/2-b.left-b.width/2}px,${a.top+a.height/2-b.top-b.height/2}px) scale(.6)`;
  void slot.offsetWidth;slot.style.transition='';slot.style.transform='';}
 await wait(450);
 return slot;
}
// ===== preview =====
function showPv(cid,el,btn){
 const c=CARDS[cid];if(!c)return;const pv=$('#pv');
 pv.innerHTML=cardHTML(c,'big '+(PEND&&PEND.kind==='lead'?'ag':PEND&&PEND.kind==='resp'?'rs':''))+(btn?`<button data-x="playsel">${esc(btn)}</button>`:'');
 const r=el.getBoundingClientRect();pv.classList.add('on');
 const pw=220;let left=Math.min(innerWidth-pw-8,Math.max(8,r.left+r.width/2-pw/2));let top=r.top-330-(btn?44:0);if(top<8)top=Math.max(8,r.bottom+8);
 if(top+330>innerHeight)top=Math.max(8,innerHeight-370);
 pv.style.left=left+'px';pv.style.top=top+'px';
}
function hidePv(){$('#pv').classList.remove('on')}
document.addEventListener('mouseover',e=>{
 if(SEL)return;const h=e.target.closest('[data-h]');const t=e.target.closest('#trow .card[data-cid],.linecard[data-cid]');
 if(h)showPv(h.dataset.h,h);else if(t)showPv(t.dataset.cid,t);else hidePv();
});
document.addEventListener('click',e=>{
 const x=e.target.closest('[data-x]');
 if(x){const k=x.dataset.x;
  if(k==='pause'){PAUSED=!PAUSED;x.textContent=PAUSED?'Resume':'Pause'}
  if(k==='speed'){SPEED=SPEED===1?0.45:SPEED===0.45?1.8:1;x.textContent='Speed: '+(SPEED===1?'normal':SPEED<1?'fast':'slow')}
  if(k==='rules')rulesScreen();
  if(k==='new')startScreen();
  if(k==='playsel'&&SEL&&PEND)PEND.res(SEL);
  if(k==='skip'&&PEND)PEND.res(null);
  if(k==='start')startGame();
  if(k==='close'){$('#ov').classList.remove('on')}
  if(k==='np'){CHOSEN=+x.dataset.n;document.querySelectorAll('.np button').forEach(b=>b.classList.toggle('on',b===x))}
  return}
 if(!PEND)return;
 const t=e.target.closest('.tok');
 if(t&&PEND.kind==='man'&&PEND.ids.includes(t.dataset.id)){PEND.res(t.dataset.id);return}
 const h=e.target.closest('[data-h]');
 if(h&&(PEND.kind==='lead'||PEND.kind==='resp')&&PEND.cids.includes(h.dataset.h)){
  if(SEL===h.dataset.h){PEND.res(SEL);return}
  SEL=h.dataset.h;renderHand();const el=document.querySelector(`[data-h="${SEL}"]`);showPv(SEL,el,PEND.kind==='lead'?'Propose this agenda':`Play: ${CARDS[SEL].resp.toUpperCase()}`);return}
 const m=e.target.closest('[data-m]');
 if(m&&(PEND.kind==='corridor'||PEND.kind==='reveal')){const id=m.dataset.m==='blank'?null:m.dataset.m;
  if(PEND.kind==='reveal'&&!PEND.ids.includes(id))return;if(PEND.kind==='corridor'&&id&&(man(id).rev||!alive(id)))return;PEND.res(id);return}
 const pl=e.target.closest('.pile');
 if(pl&&PEND.kind==='deck'&&canDraw(pl.dataset.d)){PEND.res(pl.dataset.d);return}
 const pc=e.target.closest('.pchip');
 if(pc&&PEND.kind==='player'){PEND.res(+pc.dataset.p);return}
 if(!e.target.closest('#pv')&&SEL){SEL=null;hidePv();renderHand()}
});
const _render=render;
render=function(){_render();if(PEND&&PEND.kind==='man'&&PEND.allowNone&&!$('#cap [data-x=skip]')){$('#cap').insertAdjacentHTML('beforeend',' <button class="btn" data-x="skip">Skip</button>')}};

// ================= SCREENS =================
let CHOSEN=4;
function startScreen(){
 $('#ovb').innerHTML=`<h1>THE REGIME</h1><p>Moscow, 1936. Survive the Terror.</p><p>How many players at the table? You play against the computer.</p><div class="np">${[3,4,5,6].map(n=>`<button data-x="np" data-n="${n}" class="${n===CHOSEN?'on':''}">${n}</button>`).join('')}</div><p><button class="go" data-x="start">Start the game</button> &nbsp; <button class="btn" data-x="rules">Rules</button></p>`;
 $('#ov').classList.add('on');
}
function rulesScreen(){
 $('#ovb').innerHTML=`<h1>HOW A ROUND WORKS</h1>
<p>Everyone secretly owns six men. Who owns whom comes out slowly. Survival is the point.</p>
<h2>1 · The corridor</h2><p>Everyone lays one card face down: one of his men, or the blank. They flip together, and anyone who came forward is revealed for good.</p>
<h2>2 · Five meetings</h2><p>Propaganda, NKVD, Industry, Red Army, Judiciary, in that order. A department meets only if someone has a revealed man in it. The owner of its highest revealed man chairs and goes first, then play goes clockwise. If you hold a card of that colour, you must play exactly one.</p>
<p>The chair's card is read as an <b>agenda</b> (top left). Everyone else's card is read as a <b>response</b> (bottom right).</p>
<h2>3 · The loudest voice</h2><p>Support (1) and Acclaim (2) are for; Doubt (1) and Protest (2) are against. If the room is against, the agenda fails. If it is for, the agenda grows by the margin, but never beyond its loudest supporter (Support one step, Acclaim two). Amend moves the agenda one seat up or down. Defer postpones it to the department's next meeting. Abstain says nothing. In trials, the voices make the sentence harsher or milder instead.</p>
<h2>4 · Prisons</h2><p>Arrested men wait in the Lubyanka until a trial. Sentences, mildest first: the sharashka, the Gulag, the White Sea Canal, the firing squad. The Canal moves along whenever an agenda pushes the work, and the end kills.</p>
<h2>5 · Drawing</h2><p>At the end of the round everyone draws back up to ten, one card at a time, choosing the deck in the open. Whoever chaired the Judiciary decides who draws first.</p>
<h2>The end</h2><p>The blue NKVD deck is the clock and is never reshuffled: it holds eight cards per player. When its last card is drawn, the Terror ends. For this playtest there is no declared winner: see how it feels.</p>
<p style="color:#d8c9ad;font-size:13px">Playtest safeguard: if the NKVD does not meet in a round, one blue card is burned, so the game cannot stall forever.</p>
<p><button class="go" data-x="close">Close</button></p>`;
 $('#ov').classList.add('on');
}
function endScreen(){
 let rows='';
 for(const p of S.players){const ids=owned(p.i);const f=ids.filter(isFree),pr=ids.filter(id=>alive(id)&&!isFree(id)),dd=ids.filter(id=>!alive(id));
  rows+=`<tr><td><span class="dot" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${PCOL[p.i]}"></span> <b>${esc(p.name)}</b></td><td>${f.map(id=>esc(man(id).sn)).join(', ')||'–'}</td><td>${pr.map(id=>esc(man(id).sn)+' ('+locName(id).replace('the ','')+')').join(', ')||'–'}</td><td>${dd.map(id=>esc(man(id).sn)).join(', ')||'–'}</td></tr>`}
 const free=Object.keys(S.men).filter(isFree).length;
 $('#ovb').innerHTML=`<h1>THE TERROR IS OVER</h1><p>${S.round} rounds. ${free} of ${MEN.length} men are still free. ${S.stats.arrests} arrests, ${S.stats.deaths} deaths.</p><p>No winner is declared in this playtest. Who feels like they won?</p><table class="fin"><tr><th>Player</th><th>Free</th><th>In prison</th><th>Dead</th></tr>${rows}</table><p style="margin-top:14px"><button class="go" data-x="new">New game</button> <button class="btn" data-x="close">Look at the board</button></p>`;
 $('#ov').classList.add('on');
 window.__done=true;
}
async function startGame(){
 $('#ov').classList.remove('on');GEN++;PEND=null;SEL=null;hidePv();
 for(const k in TOK){TOK[k].remove();delete TOK[k]}
 newState(CHOSEN);buildBoard();layout();render();
 try{await game()}catch(e){if(e!==CANCEL){console.error(e);document.body.dataset.err=String(e&&e.stack||e)}}
}
function layout(){
 const W=innerWidth,H=innerHeight;const tall=W<H+380;document.body.classList.toggle('tall',tall);
 const size=tall?Math.min(W,1000):H;const bw=$('#bw');bw.style.width=size+'px';bw.style.height=size+'px';
 $('#board').style.transform=`scale(${size/1000})`;
 if(S)renderHand();
}
addEventListener('resize',layout);
layout();
if(window.__autostart){CHOSEN=window.__autostart;startGame()}else startScreen();
</script>
